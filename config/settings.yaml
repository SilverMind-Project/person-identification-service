# Person Identification Service Settings
#
# Runtime overrides: any ${VAR:default} placeholder can be set via environment
# variable. Pass them through docker-compose's `environment:` section or the
# host environment. Example:
#
#   TRITON_GRPC_URL=jetson-host:8701 uvicorn app.main:app ...
#
# All other settings require editing this file or mounting a custom config/.

app:
  name: "Person Identification Service"
  version: "1.0.0"

server:
  host: "0.0.0.0"
  port: 8200

# Face detection & recognition
face_engine:
  # Buffalo_L is served by Triton. Point this at the CTS Triton service by
  # default, or set TRITON_GRPC_URL to the Jetson endpoint.
  model_name: "buffalo_l"
  triton_url: "${TRITON_GRPC_URL:triton:8701}"
  triton_timeout_ms: "${TRITON_TIMEOUT_MS:30000}"
  # Informational label exposed by /health. Use "full" for the DGX repository
  # and "int8" for triton-models-jetson.
  model_profile: "${PERSON_ID_MODEL_PROFILE:full}"
  det_size: [640, 640]
  det_threshold: "${DETECTION_THRESHOLD:0.6}"
  models:
    detector: "face-detector-scrfd"
    recognition: "face-recognition-arcface"
    landmark_2d: "face-landmark-2d106"
    landmark_3d: "face-landmark-3d68"
    genderage: "face-attribute-genderage"

# Recognition / identification
recognition:
  # Cosine similarity threshold for positive identification.
  # Faces below this are classified as "unknown".
  # Override: RECOGNITION_THRESHOLD=0.35
  threshold: "${RECOGNITION_THRESHOLD:0.4}"
  # Below this threshold, face is "definitely unknown" (not even uncertain).
  unknown_threshold: 0.25

# Motion direction detection
motion:
  # Minimum displacement as fraction of frame dimension to count as movement.
  min_displacement_fraction: 0.05
  # Minimum cosine similarity to consider the same unknown person across frames.
  cross_frame_similarity: 0.5

# PostgreSQL database (shared TimescaleDB instance)
# Must be set via DATABASE_URL environment variable — no default credentials.
database:
  dsn: "${DATABASE_URL}"

# MinIO / S3-compatible object storage for guest images
minio:
  endpoint: "${MINIO_ENDPOINT:localhost:9000}"
  access_key: "${MINIO_ACCESS_KEY:minioadmin}"
  secret_key: "${MINIO_SECRET_KEY:minioadmin}"
  bucket: "${MINIO_BUCKET:cognitive-companion}"
  secure: false

# Image annotation (bounding boxes + labels)
annotation:
  box_color_known: [0, 200, 0]       # BGR green for identified persons
  box_color_unknown: [0, 165, 255]    # BGR orange for unknown persons
  text_scale: 0.7
  text_thickness: 2
  box_thickness: 2

# ArcFace confidence calibration
# artifact_path: path to a JSON calibration artifact produced by the
#   calibration-tools CLI (uv run --extra calibration-tools python -m app.calibration.cli fit ...).
#   Absent or invalid artifact causes the service to start in degraded_missing state;
#   calibrated_confidence is null in all responses until a valid artifact is provided.
# arcface_model_version / preprocessing_version: must match the values embedded
#   in the artifact; mismatch causes degraded_incompatible and calibrated_confidence=null.
calibration:
  artifact_path: "${CALIBRATION_ARTIFACT_PATH:}"
  arcface_model_version: "${CALIBRATION_ARCFACE_MODEL_VERSION:buffalo_l}"
  preprocessing_version: "${CALIBRATION_PREPROCESSING_VERSION:v1}"

# Face image quality, reported on every identified face as quality {score, components, version}.
# scorer: the only implementation is "heuristic-v1"; any other value fails startup. Downstream
#   calibration and policy bind to the version string, so changing a value below means bumping
#   the scorer version, not silently editing it.
# heuristic: clamped linear ramps (low anchor -> 0, high anchor -> 1) combined by a weighted
#   geometric mean. Provisional until scripts/calibrate_face_quality.py is run on labeled captures.
#   iod_*_px: interocular distance in pixels; recognition collapses near 10 px and ArcFace's
#     112 px template has the eyes about 35 px apart, so gains saturate above 36 px.
#   det_*: SCRFD detection score; the detector threshold is 0.6 and above 0.9 faces are clean.
#   log_lap_var_*: log10 of the Laplacian variance of the aligned grayscale crop (1.301 = 20,
#     2.477 = 300), the standard focus measure.
#   pitch_*_deg: absolute head pitch, descending ramp (15 deg or less scores 1, 45 or more 0).
#     Yaw is excluded because tracking-orchestrator already applies a yaw frontality factor.
#   weight_*: geometric-mean exponents, must sum to 1; resolution dominates because face size is
#     the main recognition failure on household cameras.
face_quality:
  scorer: heuristic-v1
  heuristic:
    iod_low_px: 10.0
    iod_high_px: 36.0
    det_low: 0.5
    det_high: 0.9
    log_lap_var_low: 1.30103
    log_lap_var_high: 2.47712
    pitch_low_deg: 45.0
    pitch_high_deg: 15.0
    weight_resolution: 0.45
    weight_sharpness: 0.25
    weight_detection: 0.15
    weight_pitch: 0.15
    component_floor: 0.01

# Calibration capture: a stratified sample of live faces (aligned 112x112 crop in MinIO under
# calibration/, embedding, quality, capture context) kept for an operator to label, so raw
# similarity can be calibrated on this household's own cameras. Only /identify calls that carry a
# capture_context (tracking-orchestrator) are sampled.
# enabled: off by default; turn on for a 7 to 14 day collection window once every resident is
#   enrolled and the gallery is stable, then off (or a lower per_bucket_per_day for drift checks).
# per_bucket_per_day: captures kept per (quality decile, nearest identity, camera) per UTC day, so
#   low-quality faces, which the calibrator needs most, are not crowded out by easy frontal ones.
# unlabeled_retention_days: unlabeled and rejected captures (rows and crops) are deleted after this
#   many days; labeled captures are the dataset and stay until an operator deletes them.
# queue_size: captures waiting for upload; beyond it new captures are dropped and counted.
calibration_capture:
  enabled: false
  per_bucket_per_day: 40
  unlabeled_retention_days: 30
  queue_size: 64

# Visitor clustering (identity-continuity M06)
# Persists unmatched face embeddings, clusters them across visits, and lets a
# caregiver name a recurring visitor (nurse, handyman) into a household member.
# Only named clusters ever enter live tracking (D7).
visitors:
  clustering_enabled: true
  min_detection_score: 0.6
  min_face_px: 64
  member_margin: 0.05
  cluster_join_threshold: 0.55
  surface_min_days: 3
  surface_window_days: 30
  unnamed_retention_days: 60
  enroll_top_k: 5

# Logging
# Override: LOG_LEVEL=DEBUG
logging:
  level: "${LOG_LEVEL:INFO}"
