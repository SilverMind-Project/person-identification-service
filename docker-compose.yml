# Person Identification Service – Docker Compose
#
# GPU-accelerated face recognition microservice.
#
# Usage:
#   docker compose up -d
#
# Prerequisites:
#   - Shared PostgreSQL:  cd ../db && docker compose up -d
#   - MinIO object storage (external, reachable at MINIO_ENDPOINT)
#   - NVIDIA Container Toolkit (nvidia-ctk)
#
# Configuration is driven by config/settings.yaml and the required secrets
# provided to Docker Compose.

services:
  person-id:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: person-id
    restart: unless-stopped
    networks:
      - nanai
    ports:
      - "8200:8200"
    environment:
      DATABASE_URL: "postgresql://${PID_DB_USER:?err}:${PID_DB_PASSWORD:?err}@postgres:5432/person_identification"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:?err}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?err}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?err}"
      MINIO_BUCKET: "${MINIO_BUCKET:?err}"
      CUDA_DEVICE_ID: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  nanai:
    name: nanai
    external: true
