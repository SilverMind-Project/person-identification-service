# Person Identification Service – Docker Compose
#
# GPU-accelerated face recognition microservice.
#
# Usage:
#   docker compose up -d
#
# Prerequisites:
#   - Shared PostgreSQL database (cd ../db && docker compose up -d)
#   - MinIO object storage (external, reachable at MINIO_ENDPOINT)
#   - NVIDIA Container Toolkit (nvidia-ctk)
#
# Configuration is driven entirely by config/settings.yaml.
# Override individual settings at runtime via environment variables —
# each setting that supports override is documented with its env var name
# in config/settings.yaml.

services:
  person-id:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: person-id
    restart: unless-stopped
    networks:
      - nanai
    ports:
      - "8200:8200"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_BUCKET: "${MINIO_BUCKET}"
      CUDA_DEVICE_ID: "${CUDA_DEVICE_ID:-0}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  nanai:
    name: nanai
    external: true
